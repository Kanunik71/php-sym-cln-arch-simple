framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
            # Dead-letter after retries. Queue name is the DSN path; the worker does not consume it.
            failed: '%env(MESSENGER_FAILURE_TRANSPORT_DSN)%'
            sync: 'sync://'

        routing:
            'App\Application\Event\Task\TaskCreatedEvent': async
            'App\Application\Event\TaskGroup\TaskGroupsRecalculationRequestedEvent': async
            'App\Application\Event\User\UserRegisteredEvent': async
            'App\Application\Event\User\UserUpdatedEvent': async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                failed: 'in-memory://'
