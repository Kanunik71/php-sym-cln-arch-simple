schema: cln-flow

context: |
  Язык: русский — все артефакты пишутся по-русски; структурные заголовки
  (`## Purpose`, `### Requirement:`, `#### Scenario:`, GIVEN/WHEN/THEN) и
  ключевые слова SHALL/MUST остаются на английском.

  Проект: `cln-arch-sym-simple` — монорепозиторий: `api/` (Symfony 7 API, PostgreSQL,
  JWT, RabbitMQ, Redis, локальное файловое хранилище), `docker/` (nginx, php,
  воркеры), `openspec/` (спеки, changes). Целевой масштаб — ~10^6 пользователей
  и задач.

  Архитектура: слои Clean Architecture — Presentation (Controller/Console)
  → Application (Model → Service::execute, Action/Query/Lifecycle, Policy,
  ViewModelMapper) → Port (интерфейсы, в т.ч. `Port/Messaging/MessageBusInterface`)
  → Infrastructure (Doctrine, адаптеры). Слоя `Domain/` нет: персистентная модель,
  VO, enum, события и исключения живут в `Application/`.
  Архитектурные правила — в `api/AGENTS.md` (+ `api/src/Application/AGENTS.md`,
  `api/src/Infrastructure/AGENTS.md`, `api/tests/AGENTS.md`) — читай нужные
  разделы перед планированием и реализацией (proposal, design, tasks, apply);
  спеки их не дублируют, а ссылаются.
  Спеки описывают ФАКТИЧЕСКОЕ поведение кода и тестов (источник истины);
  `api/AGENTS.md` описывает ТЕКУЩУЮ архитектуру. Расхождения фактического
  поведения с задокументированным контрактом фиксируются в секции `## Notes`
  затронутых спек.

  Спеки описывают только поведение: наблюдаемые контракты (HTTP method/path,
  JSON вход/выход, статус и коды ошибок с `codeId`, CLI-команды, async-события,
  кэш/локи). Детали реализации (классы, таблицы, библиотеки) изменения
  относятся к его design.md, а не к спекам.

  Структура домена: папка домена `openspec/specs/<domain>/` содержит umbrella
  `spec.md` (поля домена и их валидация + карта подразделов) и по одному
  подразделу на use-case — `openspec/specs/<domain>/<action>/spec.md`
  (capability id `<domain>/<action>`). Дельты такого домена живут в
  `openspec/changes/<change>/specs/<domain>/<action>/spec.md`. Umbrella `spec.md`
  остаётся валидной capability: у неё должны быть свои `## Purpose` и
  `## Requirements`. Сквозные capability `wire` (формат полей), `errors`
  (формат ошибок), `query` (листинги/поиск) и `async` (RabbitMQ, планировщик) —
  однофайловые: они описывают контракты, общие для нескольких доменов. Индексная
  документация (карта доменов, связи схемы, глоссарий) живёт в
  `openspec/README.md` и не является capability.

  Имя change: каталог — `<slug>` в kebab-case (`avatar-replace`). Номер задачи в
  имя не входит даже когда он упомянут в запросе: трекер не часть идентичности
  change, а возможный источник деталей. Первая строка `proposal.md` под заголовком
  — `**Задача**: <текст запроса>`, из неё берутся критерии приёмки. Опциональная
  вторая строка `**Трекер**: <id> — <ссылка>` заводится только когда работа
  ведётся по задаче трекера; по её наличию шаги flow понимают, ходить ли в
  трекер, и не угадывают это по тексту. Отсутствия тикета достаточно, чтобы
  работать без него: спрашивать номер — не нужно.

  Команды проверки (из `api/`; в Docker:
  `docker compose -f ../docker/docker-compose.yml exec php <cmd>`):
  `composer cs-check`, `composer phpstan`, `php bin/phpunit`.
  Изменение считается готовым, только когда все три проходят на текущем дереве,
  tasks.md отмечен полностью, `openspec-verify-change` не даёт незакрытых
  CRITICAL, заполнен `verification.md` (трассировка AC, отчёт verify, замечания
  reviewer, прогоны с номером и хешем дерева, раунды критика — см. артефакт
  `verification`), а изменения поведения отражены в `openspec/specs/`.

  Порядок работ по change — `openspec/README.md` («Поток работы над change»):
  `openspec-propose` → скилл `custom-analyse` → `openspec-apply-change` → скилл
  `custom-verify` → `openspec-archive-change`. Инвариант: любая правка кода после
  прогона → снова `test-runner`; вердикт без прогона на текущем дереве не считается.
  Статус задачи в трекере — только по явному согласию пользователя.

rules:
  proposal:
    - Держи proposal до 500 слов; всегда указывай, что вне scope
    - Называй затронутые домены (openspec/specs/<capability>/) и затронуты ли миграции, async и безопасность
    - "Имя change — `<slug>` без номерных префиксов; под заголовком `**Задача**: <текст запроса>`, и `**Трекер**: <id> — <ссылка>` только если работа ведётся по задаче трекера"
  specs:
    - HTTP-контракт — только в виде сценариев GIVEN/WHEN/THEN, без таблиц маршрутов
    - Ошибки указывай с их `codeId` и HTTP-статусом
    - У каждого требования должен быть хотя бы один сценарий, который его проверяет
    - Поведение конкретного use-case'а — в `openspec/specs/<domain>/<action>/spec.md`; в umbrella `spec.md` остаются только поля домена и их валидация
    - Требования SHALL описывают наблюдаемый контракт через имена JSON-полей, HTTP-статусы, значения `codeId`, имена событий, CLI-команды и ключи кэша/локи — а не через имена PHP-классов; `## Notes` МОЖЕТ ссылаться на классы реализации и пути в исходниках как указатели трассируемости
    - Ссылайся на другие домены (auth, files, notifications), а не дублируй их правила
  design:
    - "Отобрази дизайн по слоям: Application (Service/Model/Policy/Mapper, VO/enum) → Port → Infrastructure (Doctrine/адаптер); слоя Domain нет"
    - Ссылайся на конкретные разделы api/AGENTS.md вместо пересказа архитектуры
    - "Если изменение затрагивает Application — назови роли классов (Action/Query/Lifecycle, Model, Port, Policy) и раздел AGENTS.md; отступление от архитектурного правила фиксируй явно как исключение"
    - Перечисли изменяемые файлы, миграции БД, async-сообщения, ключи кэша и тесты
    - design.md описывает только дельту изменения; постоянные контракты домена остаются в его umbrella spec.md
  tasks:
    - "Группируй задачи по фазам: Application → Infrastructure → Presentation; тесты и документация — внутри той фазы, чью работу они проверяют, отдельной финальной группы Tests не делать"
    - "Отдельная группа — только для интеграционных проверок, которые охватывают несколько фаз"
    - Каждая задача называет затрагиваемые файлы и способ проверки
    - "Задачи по Application называют роль класса (Action/Query/Lifecycle, Model, Port, Policy, Mapper) и раздел AGENTS.md, которому следует реализация"
    - "Шаги, которые нельзя выполнить до archive (обновление статуса в трекере, сама архивация) — plain-буллетами в `## Workflow follow-up`, не чекбоксами: они вне tracked-прогресса"
  verification:
    - Артефакт пишется после реализации в рамках `custom-verify`; на этапе планирования его не создавать
    - Каждый `#### Scenario:` дельт и каждый критерий из текста `**Задачи**` (при заполненном `**Трекер**` — и формулировки work package) — отдельной строкой трассировки AC с ссылкой на код и на тест
    - "Прогон фиксируется фактами: команда, окружение (host или docker), результат, номер прогона и git rev-parse HEAD; недоступные БД/Redis/RabbitMQ — «не запускалось», это не passing; правка после прогона требует нового прогона"
    - "Отчёт openspec-verify-change попадает в артефакт тремя измерениями (Completeness, Correctness, Coherence); «Not verified (причина)» пишется как причина пропуска, а не убирается"
    - Замечания reviewer сохраняют цитату правила и severity; неисправленный minor переезжает в «Хвосты», а не исчезает
    - Тексты ролей проверки — `.agents/roles/`, права и способ запуска — адаптеры инструмента; в артефакте фиксируется, как роли исполнялись (субагенты или inline), потому что inline без изоляции контекста — это другой уровень независимости критика
    - Раунды критика — поимённо; после второго NEEDS_WORK фиксируется решение пользователя, третьего раунда не бывает

operations:
  apply:
    guidance:
      - Запускай `composer cs-check`, `composer phpstan` и `php bin/phpunit` из api/ (через docker), прежде чем отмечать группу выполненной
      - Перед правкой кода сверься с разделом AGENTS.md своего слоя; отступление от архитектурного правила согласуй с пользователем и зафиксируй в design.md
      - Отмечай чекбоксы tasks.md по мере работы; обновляй спеки openspec при изменении поведения
      - "После последней задачи — @custom-verify (test-runner → openspec-verify-change → reviewer → critic), затем verification.md; любая правка кода возвращает на test-runner"
  archive:
    guidance:
      - Перед завершением перечисли, что поставляется и какие файлы спек обновлены
      - "Файл `verification.md` должен быть заполнен: незавершённые артефакты archive показывает как warning и просит подтверждения — подтверждать только по явному слову пользователя"
      - "Не архивировать при незакрытом CRITICAL из verify, NEEDS_WORK критика без решения пользователя или прогоне, сделанном до последних правок"
      - "Статус work package в трекере менять только если в proposal.md заполнена строка `**Трекер**`, и только после явного согласия пользователя — вместе с changelog-комментарием"
      - "Если `**Трекер**` нет — шаг с трекером не выполняется и не считается незакрытым: работа без задачи в трекере допустима"
